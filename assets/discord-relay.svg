    <!-- Original geometry from Reddit_Icon_1Color_Silhouette.svg. -->
    <path id="reddit-symbol" d="m228.56,98.04c-6.85,0-13.16,2.31-18.2,6.19-13.72-8.49-31.04-13.83-49.99-14.54,0-.03,0-.05,0-.08,0-12.7,9.44-23.24,21.68-24.97,2.22,9.41,10.67,16.42,20.76,16.42,11.78,0,21.33-9.55,21.33-21.33s-9.55-21.33-21.33-21.33c-10.3,0-18.89,7.3-20.89,17.01-17.25,1.85-30.72,16.48-30.72,34.21,0,.04,0,.07,0,.11-18.76.79-35.89,6.13-49.49,14.56-5.05-3.91-11.39-6.24-18.27-6.24-16.51,0-29.89,13.38-29.89,29.89,0,11.98,7.04,22.3,17.21,27.07.99,34.7,38.8,62.61,85.31,62.61s84.37-27.94,85.31-62.67c10.09-4.8,17.07-15.09,17.07-27,0-16.51-13.38-29.89-29.89-29.89Z"/>

    <clipPath id="left-half">
      <path d="M0 0h364l-38 80-36 110h14l-58 96h32l-65 112v114H0Z"/>
    </clipPath>
    <clipPath id="right-half">
      <path d="M364 0h148v512H213V398l65-112h-33l58-96h-14l36-110Z"/>
    </clipPath>
    <linearGradient id="relay-gradient" x1="340" y1="230" x2="210" y2="230">
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" fill="#0B1020"/>

  <g id="app-mark" transform="translate(256 256) scale(1.15) translate(-256 -256)">
    <!-- Two brand marks meet along a diagonal lightning-bolt split. -->
    <g id="combined-brands">
      <g clip-path="url(#left-half)" fill="#FF4500">
        <use href="#reddit-symbol" transform="translate(15 73) scale(1.4)"/>
      </g>
      <g clip-path="url(#right-half)" fill="#5865F2">
        <use href="#discord-symbol" transform="translate(88 158) scale(2.653)"/>
      </g>
      <path d="M326 80 290 190h14l-58 96h32l-65 112v34" fill="none" stroke="#0B1020" stroke-width="10" stroke-linejoin="bevel"/>
    </g>

    <!-- One-way signal stream: Reddit (left) to Discord (right). -->
    <g id="relay" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(532 32.5) scale(-1 1)">
      <path d="M340 235c-35-25-80-25-120 0m11-37-19 42 45.21 9" stroke="#0B1020" stroke-width="26"/>
      <path d="M340 235c-35-25-80-25-120 0m11-37-19 42 45.21 9" stroke="url(#relay-gradient)" stroke-width="12"/>
    </g>
  </g>
</svg>
