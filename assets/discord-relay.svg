<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Discord Relay</title>
  <desc id="description">Reddit on the left and Discord on the right meet at a lightning-bolt split, with a flowing arrow relaying from Reddit to Discord.</desc>

